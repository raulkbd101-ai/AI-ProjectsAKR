name: JobG's CI

on:
  push:
    branches: [main]
    paths:
      - "projects/JobG's/jobgs-engine/**"
      - ".github/workflows/jobgs-engine.yml"
  pull_request:
    branches: [main]
    paths:
      - "projects/JobG's/jobgs-engine/**"
      - ".github/workflows/jobgs-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Python ${{ matrix.python-version }} checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: "projects/JobG's/jobgs-engine"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: "projects/JobG's/jobgs-engine/requirements.txt"

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q app.py database.py matcher.py evidence_profile.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
